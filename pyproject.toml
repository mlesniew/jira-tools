[project]
name = "jira-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michał Leśniewski", email = "mlesniew@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "atlassian-python-api>=4.0.7",
    "marklas>=0.8.2",
    "pydantic>=2.13.4",
    "typer>=0.26.8",
]

[project.scripts]
jira-tools = "jira_tools:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "responses>=0.26.1",
    "ruff>=0.15.20",
]

[tool.mypy]
strict = true
files = ["src", "tests", "install.py"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
